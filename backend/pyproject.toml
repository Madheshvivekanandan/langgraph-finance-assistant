[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-finance-backend"
version = "0.1.0"
description = "My Finance backend - FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "langgraph>=1.2,<2",
    "langchain>=1.0,<2",
    "langchain-openai",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "langgraph-cli[inmem]>=0.4",
    # Drives scripts/screenshot_ui.py - renders the UI and fails on layout defects.
    "playwright>=1.47",
    # Enforces the layer boundaries in CLAUDE.md; ruff and mypy cannot see them.
    "import-linter>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "SIM", "C4", "RET", "ARG", "PTH", "ASYNC", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"app/db/migrations/**" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Force log records to actually be built during tests. Without this the root
# logger stays at WARNING, logger.info() short-circuits, and a bad `extra` key
# (e.g. a reserved LogRecord attribute) only ever blows up in production.
log_level = "INFO"

# Dependency direction, which no formatter or type checker can see. A service
# importing from `app.api` typechecks perfectly and inverts the architecture -
# that exact bug shipped once, so it is a gate now rather than a convention.
[tool.importlinter]
root_package = "app"
# Required because a contract below names third-party packages (fastapi,
# sqlalchemy) as forbidden imports, not just first-party modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Nothing below the API layer imports it"
type = "forbidden"
source_modules = [
    "app.services",
    "app.graphs",
    "app.repositories",
    "app.clients",
    "app.models",
    "app.db",
    "app.domain",
    "app.utils",
]
forbidden_modules = ["app.api"]

[[tool.importlinter.contracts]]
name = "The domain is framework-free"
type = "forbidden"
source_modules = ["app.domain", "app.utils"]
forbidden_modules = ["fastapi", "sqlalchemy", "app.api", "app.services", "app.repositories", "app.db"]

[[tool.importlinter.contracts]]
name = "Repositories do not depend on services or graphs"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services", "app.graphs"]
